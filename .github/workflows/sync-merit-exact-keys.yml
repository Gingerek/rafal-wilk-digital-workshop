name: Sync exact Merit keys once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-merit-exact-keys.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy corrected Merit workbook
        shell: bash
        run: |
          set -euo pipefail
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          curl -L --fail --retry 3 --output "$FILE" 'https://raw.githubusercontent.com/Gingerek/rafal-wilk-ai/main/downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
      - name: Commit synchronized workbook
        shell: bash
        run: |
          FILE='downloads/Merit_2026_Employee_Bulk_Calculator_350_exact.xlsx'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Sync Merit exact source title keys'
          git push
