name: Contract Budget Hours QA
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/js/contract-budget-hours.js'
      - 'assets/js/contract-budget-layout.js'
      - '.github/workflows/contract-budget-hours-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core
      - name: Test embedded calculator in Chromium
        run: |
          export CHROME_BIN="$(which google-chrome-stable || which google-chrome || which chromium || which chromium-browser)"
          python3 -m http.server 4173 > /tmp/http.log 2>&1 &
          node <<'NODE'
          const fs=require('fs'),{chromium}=require('playwright-core');
          (async()=>{
            const src=fs.readFileSync('assets/js/legacy-apps-bundle.js','utf8');
            const a=src.indexOf('const APPS = ')+13,b=src.indexOf('];',a)+1;
            const apps=JSON.parse(src.slice(a,b));
            const html=Buffer.from(apps[0].b64,'base64').toString('utf8');
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:950}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded'});
            await page.evaluate(html=>{
              const f=document.getElementById('appframe');
              f.loading='eager';f.srcdoc=html;f.classList.add('show');
              document.body.classList.add('app-open');
              document.querySelector('.viewport')?.classList.add('active');
            },html);
            await page.waitForFunction(()=>!!document.querySelector('#appframe')?.contentDocument?.getElementById('rwContractHoursTile'),null,{timeout:15000});
            const frame=page.frameLocator('#appframe');
            async function scenario(weekly,start,end,expected,language='en'){
              await page.evaluate(({weekly,start,end,language})=>{
                const d=document.querySelector('#appframe').contentDocument;
                for(const [id,v] of [['langSelect',language],['uren',weekly],['start',start],['eind',end]]){
                  const el=d.getElementById(id);
                  el.value=v;
                  el.dispatchEvent(new Event('input',{bubbles:true}));
                  el.dispatchEvent(new Event('change',{bubbles:true}));
                }
              },{weekly,start,end,language});
              await page.waitForTimeout(800);
              const output=await page.evaluate(()=>document.querySelector('#appframe').contentDocument.querySelector('#rwContractHoursTile [data-rw-hours-value]').textContent.trim());
              if(output!==expected)throw new Error([weekly,start,end,expected,output].join(' / '));
              console.log('HOURS_PASS',JSON.stringify({weekly,start,end,expected,language}));
            }
            await scenario('40','01-10-2026','31-10-2026','176');
            await scenario('40','14-10-2026','14-10-2026','8');
            await scenario('40','17-10-2026','18-10-2026','0');
            await scenario('40','16-10-2026','19-10-2026','16');
            await scenario('37,5','12-10-2026','16-10-2026','37,5','nl');
            await scenario('40','20-10-2026','19-10-2026','—','pl');

            await page.waitForFunction(()=>document.querySelector('#appframe')?.contentDocument?.documentElement.classList.contains('rw-budget-pro'),null,{timeout:9000});
            const check=await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument;
              return {
                sections:d.querySelectorAll('.rw-budget-section').length,
                original:d.querySelectorAll('.rw-budget-section .row').length,
                days:d.querySelector('#rwWorkingDaysValue')?.textContent,
                groups:d.querySelectorAll('.rw-budget-group').length,
                CSS:d.querySelector('#rw-contract-budget-professional-v2')?.textContent.length||0,
                columns:getComputedStyle(d.querySelector('.layout')).gridTemplateColumns
              };
            });
            console.log('REDESIGN_DESKTOP',JSON.stringify(check));
            if(check.sections!==2||check.groups!==3||check.original!==6||check.CSS<1000)throw new Error('Restructured sections missing: '+JSON.stringify(check));
            await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument;
              const state={tarief:'34',uren:'40',start:'01-10-2026',eind:'31-10-2026',budget:'9876',wekenMan:''};
              for(const [id,v] of Object.entries(state)){
                const el=d.getElementById(id);
                el.value=v;
                el.dispatchEvent(new Event('input',{bubbles:true}));
                el.dispatchEvent(new Event('change',{bubbles:true}));
              }
              d.getElementById('ceil').checked=true;
              d.getElementById('ceil').dispatchEvent(new Event('change',{bubbles:true}));
            });
            await page.waitForTimeout(1400);
            const automatic=await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument;
              const text=id=>d.getElementById(id)?.textContent.trim();
              return {weeks:text('weeksUsed'),planned:text('planned'),hours:text('rwContractHoursTile'),workDays:text('rwWorkingDaysValue'),startISO:d.getElementById('startISO')?.value,endISO:d.getElementById('eindISO')?.value};
            });
            console.log('REDESIGN_BUDGET_AUTOMATIC',JSON.stringify(automatic));
            if(automatic.weeks!=='5' || automatic.startISO!=='2026-10-01' || automatic.endISO!=='2026-10-31')throw new Error('Date sync and original week formulas did not update: '+JSON.stringify(automatic));
            if(!automatic.planned.includes('6.800')||automatic.workDays!=='22')throw new Error('Original planned budget or new working days are wrong: '+JSON.stringify(automatic));
            await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument,el=d.getElementById('wekenMan');
              el.value='2';el.dispatchEvent(new Event('input',{bubbles:true}));
            });
            await page.waitForTimeout(750);
            const manual=await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument;
              return {weeks:d.getElementById('weeksUsed').textContent.trim(),planned:d.getElementById('planned').textContent.trim(),hours:d.querySelector('#rwContractHoursTile [data-rw-hours-value]').textContent.trim(),hint:d.querySelector('[data-rw-ui="override"]').textContent.trim()};
            });
            console.log('REDESIGN_BUDGET_OVERRIDE',JSON.stringify(manual));
            if(manual.weeks!=='2'||!manual.planned.includes('2.720')||manual.hours!=='176'||!manual.hint.includes('Manual'))throw new Error('Manual override unexpectedly changes hours or fails budget: '+JSON.stringify(manual));
            await page.screenshot({path:'budget-hours-qa.png',fullPage:true});
            await page.setViewportSize({width:390,height:844});
            await page.waitForTimeout(400);
            const mobile=await page.evaluate(()=>{
              const d=document.querySelector('#appframe').contentDocument;
              return {viewport:d.defaultView.innerWidth,columns:getComputedStyle(d.querySelector('.layout')).gridTemplateColumns,formWidth:d.querySelector('.layout>.card').getBoundingClientRect().width,scrollWidth:d.documentElement.scrollWidth,tiles:d.querySelectorAll('#resultCard .kpi .tile').length};
            });
            console.log('REDESIGN_MOBILE',JSON.stringify(mobile));
            if(mobile.scrollWidth>mobile.viewport+5)throw new Error('Mobile horizontal overflow: '+JSON.stringify(mobile));
            await page.screenshot({path:'budget-hours-mobile.png',fullPage:true});
            const count=await frame.locator('#resultCard .kpi .tile').count();
            console.log('LEGACY_TILES',count);
            if(count<5||errors.length)throw new Error('Legacy results missing or JS errors: '+JSON.stringify(errors));
            console.log('CONTRACT_BUDGET_QA_PASS');
            await browser.close();
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: budget-hours-screenshot
          path: |
            budget-hours-qa.png
            budget-hours-mobile.png
          if-no-files-found: ignore
