name: Contract budget DOM inspection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/budget-diagnostic.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: npm install --no-save playwright-core
      - name: Inspect legacy budget source
        run: |
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('assets/js/legacy-apps-bundle.js','utf8');
          const terms=['function loadApp(', 'loadApp =', 'window.loadApp', '__origLoad', 'srcdoc', 'const apps', 'const APPS', 'var APP', 'Contract Budget Calculator','budżet','Contract Budget'];
          for(const term of terms){
            const i=s.indexOf(term);console.log('BUNDLE_SEARCH',JSON.stringify({term,at:i,snippet:i>=0?s.slice(Math.max(0,i-350),i+1100):''}));
          }
          console.log('BUNDLE_LENGTH',s.length);
          const p=s.indexOf('const APPS = ')+13;
          const q=s.indexOf('];',p)+1;
          const list=JSON.parse(s.slice(p,q));
          const budget=Buffer.from(list[0].b64,'base64').toString('utf8');
          console.log('BUDGET_HTML',JSON.stringify({title:list[0].title,length:budget.length,headings:[...budget.matchAll(/<h[1-4][^>]*>[\\s\\S]*?<\\/h[1-4]>/gi)].slice(0,25).map(x=>x[0].slice(0,230)),fields:[...budget.matchAll(/<(input|select|button|output)[^>]*>/gi)].slice(0,95).map(x=>x[0].slice(0,240)),sections:[...budget.matchAll(/<section[^>]*>|<main[^>]*>|<div[^>]+class="[^"]*card[^"]*"[^>]*>/gi)].slice(0,40).map(x=>x[0].slice(0,160)),bodyStart:budget.slice(budget.indexOf('<body'),budget.indexOf('<body')+4500)}));

          NODE
      - name: Inspect budget module in Chromium
        run: |
          CHROME_BIN="$(which google-chrome-stable || which google-chrome || which chromium || which chromium-browser)" node <<'NODE'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({headless:true,executablePath:process.env.CHROME_BIN,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e)));
            page.on('requestfailed',r=>errors.push('Network '+r.url()+': '+r.failure()?.errorText));
            await page.goto('https://www.rafalwilkai.com/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.evaluate(()=>window.__rwLoadLegacyApps?.());
            await page.waitForFunction(()=>typeof window.loadApp==='function');
            console.log('BUDGET_SOURCE',JSON.stringify(await page.evaluate(()=>({loaded:window.__rwLegacyAppsLoaded,fn:String(window.loadApp).slice(0,1600),iframeCount:document.querySelectorAll('iframe').length}))));
            await page.evaluate(()=>window.loadApp(0));
            await page.waitForTimeout(3000);
            const root=await page.evaluate(()=>({
              frames:[...document.querySelectorAll('iframe')].map(f=>({id:f.id,src:f.src,srcdocSize:f.getAttribute('srcdoc')?.length||0,show:f.className,docText:f.contentDocument?.body?.innerText?.slice(0,400)||''})),
              body:document.body.className,
              fn:String(window.loadApp).slice(0,900)
            }));
            console.log('BUDGET_FRAME',JSON.stringify(root));
            const frame=page.frameLocator('#appframe');
            const tree=await frame.locator('body').evaluate(el=>({
              title:document.title,
              text:el.innerText.slice(0,12000),
              forms:[...document.querySelectorAll('form')].map(e=>({id:e.id,className:e.className})),
              fields:[...document.querySelectorAll('input,select,button,output')].slice(0,120).map(e=>({tag:e.tagName,id:e.id,name:e.name||'',type:e.type||'',placeholder:e.placeholder||'',text:(e.textContent||'').trim().slice(0,80),value:e.value||'',outer:e.outerHTML.slice(0,300)})),
              headings:[...document.querySelectorAll('h1,h2,h3,h4,section,.card,.panel')].slice(0,40).map(e=>({tag:e.tagName,id:e.id,className:e.className,text:e.textContent?.trim().slice(0,110)}))
            })).catch(e=>({error:String(e)}));
            console.log('BUDGET_DOM',JSON.stringify(tree));
            console.log('BUDGET_ERRORS',JSON.stringify(errors));
            await page.screenshot({path:'budget-module.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e.stack||String(e));process.exit(1)});
          NODE
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: budget-module-inspection
          path: budget-module.png
          if-no-files-found: ignore
